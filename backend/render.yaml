services:
  - type: web
    name: officialai-backend
    env: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma migrate deploy; npx prisma db push --skip-generate --accept-data-loss; npm run seed; npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: officialai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_FALLBACKS
        value: gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_MODE
        value: local
      - key: EMAIL_MODE
        value: smtp
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: officialai-db
    databaseName: officialai
    user: officialai_user
