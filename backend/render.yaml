services:
  - type: web
    name: officialai-backend
    env: node
    buildCommand: npm install --include=dev && npm run build && npx prisma generate
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: officialai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_MODE
        value: local
      - key: EMAIL_MODE
        value: log
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: officialai-db
    databaseName: officialai
    user: officialai_user
