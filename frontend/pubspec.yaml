name: officialai
description: AI-powered official document assistant for Turkish users
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Networking
  dio: ^5.6.0
  pretty_dio_logger: ^1.4.0

  # Local Storage - ücretsiz, GMS bağımlılığı YOK
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI & Assets - ücretsiz
  lottie: ^3.1.3
  flutter_svg: ^2.0.10
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Features - tamamen ücretsiz, GMS bağımlılığı YOK (Amazon Appstore uyumlu)
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  pdfx: ^2.8.0
  printing: ^5.13.4
  share_plus: ^7.2.1
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.0
  # PDF oluşturma için (printing package + widget'lar)
  pdf: ^3.11.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
