org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
# Kotlin derleyicisini ayrı daemon yerine Gradle süreci içinde çalıştır
# (kısıtlı ortamlarda daemon geçici dosya erişimi sorunlarını önler).
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
